<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планировщик подарков</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎁 Планировщик подарков</h1>
 
    <div class="input-section">
      <input type="text" id="giftInput" placeholder="Название подарка...">
      <input type="text" id="recipientInput" placeholder="Для кого...">
      <button onclick="addGift()">Добавить</button>
    </div>
 
    <div class="stats">
      <span>Всего: <strong id="totalCount">0</strong></span>
      <span>Куплено: <strong id="boughtCount">0</strong></span>
      <button onclick="filterGifts('all')">Все</button>
      <button onclick="filterGifts('active')">Ожидают</button>
      <button onclick="filterGifts('bought')">Купленные</button>
    </div>
 
    <ul id="giftList"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
